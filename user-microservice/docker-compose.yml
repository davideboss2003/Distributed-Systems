version: '3.8'

services:
  mysql-users:
    image: mysql:8.0
    container_name: mysql-users-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: energy_users_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-users-data:/var/lib/mysql
    networks:
      - energy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-microservice-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-users:3306/energy_users_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
      DEVICE_MICROSERVICE_URL: http://device-microservice:8082
    depends_on:
      mysql-users:
        condition: service_healthy
    networks:
      - energy-network

networks:
  energy-network:
    driver: bridge
    external: true


volumes:
  mysql-users-data:
    driver: local