# Server Configuration
server.port=8081
spring.application.name=user-microservice

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/energy_users_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# SQL script execution
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=your-secret-key-min-256-bits-for-hs256-algorithm-energy-management
jwt.expiration=86400000



# Actuator
management.endpoints.web.exposure.include=health,info

# Device Microservice URL
device.microservice.url=http://localhost:8082

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

