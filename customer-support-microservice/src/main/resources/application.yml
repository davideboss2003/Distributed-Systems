spring:
  application:
    name: customer-support-microservice
  
  # Database Configuration (MySQL)
  datasource:
    url: jdbc:mysql://mysql-users:3306/energy_users_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  # RabbitMQ Configuration
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 8086

# Gemini AI Configuration
gemini:
  apiKey: AIzaSyAioKjdm4UAO9UX75HahDBNIyqlryUv8zA
  apiUrl: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
  timeout: 15000
  enabled: true

logging:
  level:
    com.energy.support: DEBUG
